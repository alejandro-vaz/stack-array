[package]
name = "stack-array"
description = "A maximally-sized array stored on the stack"
version = "1.2.2"
edition = "2024"
rust-version = "1.99"
categories = ["algorithms", "data-structures", "memory-management", "no-std"]
keywords = ["array", "stack", "stack-array", "collections"]
repository = "https://github.com/alejandro-vaz/stack-array"
license = "MIT"
authors = ["Alejandro Vaz <alejandro.vaz.myt@gmail.com>"]

[lib]
path = "./lib.rs"

[[bench]]
name = "stack-array"
harness = false
path = "benches.rs"

[[test]]
name = "stack-array"
path = "tests.rs"

[dependencies]
constrangeiter = "0.0"

[dev-dependencies]
criterion = "0.8"
arrayvec = "0.7.8"